<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Decision Dashboard - SOP Insight Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&family=Noto+Sans+SC:wght@200;300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== CARBON DESIGN TOKENS (Swiss International) ===== */
:root{
  --paper:#fafaf8;--paper-rgb:250,250,248;--ink:#0a0a0a;--ink-rgb:10,10,10;
  --grey-1:#f0f0ee;--grey-2:#d4d4d2;--grey-3:#737373;
  --accent:#002FA7;--accent-rgb:0,47,167;--accent-on:#ffffff;--accent-bright:#5B7BFF;
  --sans:"Inter","Helvetica Neue","Helvetica","Arial",system-ui,sans-serif;
  --sans-zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono","IBM Plex Mono","SF Mono","Consolas",monospace;
  --sp-3:8px;--sp-4:12px;--sp-5:16px;--sp-6:24px;--sp-7:32px;--sp-8:40px;
  --sp-9:48px;--sp-10:64px;--sp-11:80px;
  --text-primary:#0a0a0a;--text-secondary:#525252;--text-helper:#737373;--text-placeholder:#a3a3a3;
  --border-subtle:#e0e0e0;
  --red:#DC2626;--orange:#F97316;--yellow:#EAB308;--green:#22C55E;--teal:#5A9E96;
  /* Carbon motion */
  --ease-prod:cubic-bezier(.2,0,.38,.9);--ease-exp:cubic-bezier(.4,.14,.3,1);
  --dur-fast:.11s;--dur-mod:.24s;--dur-slow:.4s;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:var(--sans),var(--sans-zh);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

/* ===== ANIMATED CANVAS BACKGROUND (Swiss dot matrix) ===== */
canvas.bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block;opacity:.42;mix-blend-mode:multiply;pointer-events:none}
body.low-power canvas.bg{opacity:.18}

/* ===== APP SHELL ===== */
.app{position:relative;z-index:1;display:grid;grid-template-rows:auto 1fr;height:100vh}

/* ===== TOPBAR ===== */
.topbar{display:flex;align-items:center;gap:var(--sp-5);padding:var(--sp-4) var(--sp-6);
  border-bottom:1px solid var(--border-subtle);background:var(--paper);flex-wrap:wrap}
.topbar h1{font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;white-space:nowrap;font-family:var(--sans)}
.topbar .divider{width:1px;height:18px;background:var(--grey-2)}
.sim-group{display:flex;align-items:center;gap:var(--sp-4);flex:1;overflow-x:auto;flex-wrap:wrap}
.sim-item{display:flex;align-items:center;gap:var(--sp-3);font-size:0.6rem;white-space:nowrap;font-family:var(--mono)}
.sim-item label{color:var(--text-helper);text-transform:uppercase;letter-spacing:0.06em;font-size:0.55rem;min-width:55px;font-weight:500}
.sim-item input[type=range]{width:72px;accent-color:var(--accent);height:2px}
.sim-item .val{color:var(--accent);font-weight:600;min-width:32px;text-align:right;font-size:0.65rem}
.btn{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border:1px solid var(--border-subtle);
  background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:0.6rem;font-weight:500;
  cursor:pointer;text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap;transition:all var(--dur-fast) var(--ease-prod);border-radius:0}
.btn:hover{background:var(--grey-1);border-color:var(--grey-2)}.btn:active{background:var(--grey-2)}
.btn.accent{background:var(--accent);color:var(--accent-on);border-color:var(--accent)}.btn.accent:hover{background:var(--accent-bright)}
.btn-close{font-size:1rem;padding:2px 8px;line-height:1}

/* ===== MAIN GRID (3 columns, Swiss proportions) ===== */
.main-grid{display:grid;grid-template-columns:300px 1fr 300px;height:100%;overflow:hidden}
.panel{border-right:1px solid var(--border-subtle);overflow-y:auto;padding:var(--sp-5);scrollbar-width:thin;scrollbar-color:var(--grey-2) transparent}
.panel:last-child{border-right:none}
.panel::-webkit-scrollbar{width:4px}.panel::-webkit-scrollbar-thumb{background:var(--grey-2)}
.panel h2{font-size:0.65rem;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;
  color:var(--text-helper);margin-bottom:var(--sp-5);padding-bottom:var(--sp-3);border-bottom:1px solid var(--border-subtle)}

/* ===== NODE CARDS (strict Swiss: no radius, 3px left accent) ===== */
.node-card{border-left:3px solid var(--grey-2);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-3);
  cursor:pointer;transition:border-color var(--dur-fast) var(--ease-prod),background var(--dur-fast) var(--ease-prod);
  background:var(--paper);border-radius:0}
.node-card:hover{border-color:var(--accent);background:rgba(var(--accent-rgb),0.03)}
.node-card.active{border-color:var(--accent);background:rgba(var(--accent-rgb),0.05)}
.node-card .name{font-size:0.7rem;font-weight:500;margin-bottom:1px;letter-spacing:-0.01em}
.node-card .meta{font-size:0.55rem;color:var(--text-helper);font-family:var(--mono);display:flex;gap:var(--sp-4)}
.node-card.start{border-left-color:var(--green)}.node-card.end{border-left-color:var(--grey-3)}
.node-badge{display:inline-block;padding:1px 5px;font-size:0.5rem;font-weight:600;border-radius:0;
  margin-left:4px;text-transform:uppercase;letter-spacing:0.06em}
.node-badge.kpi{background:rgba(var(--accent-rgb),0.07);color:var(--accent)}
.node-badge.risk{background:rgba(249,115,22,0.07);color:var(--orange)}

/* ===== KPI COMPONENTS ===== */
.kpi-row{display:flex;justify-content:space-between;align-items:center;padding:var(--sp-3) 0;border-bottom:1px solid var(--grey-1);transition:background var(--dur-fast) var(--ease-prod)}
.kpi-row:hover{background:rgba(var(--accent-rgb),0.02)}
.kpi-row .name{font-size:0.68rem;font-weight:500;flex:1;letter-spacing:-0.01em}
.kpi-row .branch{font-size:0.5rem;color:var(--text-helper);text-transform:uppercase;letter-spacing:0.06em;margin-right:var(--sp-3);font-weight:500}
.kpi-row .val{font-size:0.9rem;font-weight:300;font-family:var(--mono);letter-spacing:-0.03em;min-width:55px;text-align:right}
.kpi-row .val.pass{color:var(--green)}.kpi-row .val.warn{color:var(--orange)}.kpi-row .val.fail{color:var(--red)}
.kpi-trend{display:flex;align-items:flex-end;gap:1px;height:24px;margin-top:var(--sp-3)}
.kpi-trend-bar{flex:1;background:var(--accent);min-width:2px;transition:height var(--dur-slow) var(--ease-exp);border-radius:0}
.kpi-target-edit{width:50px;border:1px solid var(--border-subtle);font-family:var(--mono);font-size:0.65rem;
  padding:2px 4px;text-align:right;background:var(--paper);border-radius:0;transition:border-color var(--dur-fast) var(--ease-prod)}
.kpi-target-edit:focus{border-color:var(--accent);outline:none}

/* ===== GAUGE ===== */
.gauge-large{text-align:center;padding:var(--sp-7) 0 var(--sp-5)}
.gauge-num{font-size:3.2rem;font-weight:200;letter-spacing:-0.04em;line-height:1;font-family:var(--mono);font-feature-settings:"tnum"}
.gauge-label{font-size:0.55rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--text-helper);margin-top:var(--sp-3);font-weight:500}

/* ===== RISK COMPONENTS ===== */
.risk-item{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-4);
  margin-bottom:var(--sp-2);cursor:pointer;border-left:2px solid transparent;transition:all var(--dur-fast) var(--ease-prod);border-radius:0}
.risk-item:hover{background:var(--grey-1);border-left-color:currentColor}
.risk-dot{width:8px;height:8px;flex-shrink:0}
.risk-item .info{flex:1;min-width:0}
.risk-item .name{font-size:0.68rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.01em}
.risk-item .cat{font-size:0.5rem;color:var(--text-helper);text-transform:uppercase;letter-spacing:0.05em;font-weight:500}
.risk-item .score{font-size:0.75rem;font-weight:300;font-family:var(--mono);letter-spacing:-0.02em}

/* ===== HEATMAP (strict Swiss grid, no radius, no shadows) ===== */
.heatmap-grid{display:grid;grid-template-columns:50px repeat(3,1fr);gap:1px;background:var(--grey-2);
  border:1px solid var(--grey-2);margin-bottom:var(--sp-5);border-radius:0}
.heatmap-grid .hdr{background:var(--paper);padding:3px 4px;font-size:0.48rem;text-align:center;
  text-transform:uppercase;color:var(--text-helper);font-weight:600;letter-spacing:0.06em}
.heatmap-grid .rlabel{background:var(--paper);padding:3px 4px;font-size:0.48rem;text-align:right;
  text-transform:uppercase;color:var(--text-helper);font-weight:600;letter-spacing:0.06em}
.heatmap-grid .cell{padding:8px 4px;text-align:center;font-size:0.6rem;font-weight:500;
  font-family:var(--mono);transition:all var(--dur-fast) var(--ease-prod);cursor:pointer;border-radius:0}
.heatmap-grid .cell:hover{opacity:0.75}

/* ===== DETAIL OVERLAY (slide-up, Swiss motion) ===== */
.detail-overlay{position:fixed;bottom:0;left:0;right:0;max-height:42vh;background:var(--paper);
  border-top:2px solid var(--accent);z-index:100;overflow-y:auto;
  transform:translateY(100%);transition:transform var(--dur-slow) var(--ease-exp)}
.detail-overlay.open{transform:translateY(0)}
.detail-header{display:flex;justify-content:space-between;align-items:center;padding:var(--sp-4) var(--sp-6);border-bottom:1px solid var(--border-subtle)}
.detail-header .t-meta{font-size:0.65rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-helper)}
.detail-body{padding:var(--sp-5) var(--sp-6);display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-5)}
.detail-footer{padding:var(--sp-4) var(--sp-6);border-top:1px solid var(--border-subtle);font-size:0.55rem;color:var(--text-helper)}

/* ===== PROP GROUPS (Swiss info display) ===== */
.prop-group h4{font-size:0.55rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--accent);margin-bottom:var(--sp-3);font-weight:600}
.prop-row{display:flex;justify-content:space-between;padding:2px 0;font-size:0.65rem;border-bottom:1px solid var(--grey-1)}
.prop-row .k{color:var(--text-helper);font-weight:400}.prop-row .v{font-family:var(--mono);font-weight:500;letter-spacing:-0.01em}

/* ===== SIMULATION RESULTS BAR ===== */
.sim-results{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-4);padding:var(--sp-4);margin-bottom:var(--sp-5);
  background:var(--grey-1);border:1px solid var(--border-subtle);border-radius:0;animation:fadeIn var(--dur-slow) var(--ease-exp)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.sim-stat{text-align:center}.sim-val{font-size:1.1rem;font-weight:200;font-family:var(--mono);letter-spacing:-0.03em;line-height:1;font-feature-settings:"tnum"}
.sim-label{font-size:0.5rem;text-transform:uppercase;color:var(--text-helper);letter-spacing:0.08em;margin-top:3px;font-weight:500}

/* ===== TIME SLIDER ===== */
.time-slider{display:flex;align-items:center;gap:var(--sp-4);padding:0 var(--sp-4)}
.time-slider input[type=range]{flex:1;accent-color:var(--accent);max-width:180px;height:2px}
.time-slider .time-label{font-size:0.55rem;color:var(--text-helper);font-family:var(--mono);white-space:nowrap;font-weight:500}

/* ===== MERMAID WRAPPER ===== */
.mermaid-wrap{font-family:var(--mono);font-size:0.55rem;color:var(--text-helper);padding:var(--sp-4);
  background:var(--grey-1);border:1px solid var(--border-subtle);border-radius:0;margin-top:var(--sp-5);
  white-space:pre;overflow-x:auto;line-height:1.6}

/* ===== RESPONSIVE ===== */
@media(max-width:1200px){.main-grid{grid-template-columns:240px 1fr 240px}}
@media(max-width:900px){.main-grid{grid-template-columns:1fr}.panel{border-right:none;border-bottom:1px solid var(--border-subtle)}.detail-body{grid-template-columns:1fr}}
</style>
</head>
<body class="low-power">
<canvas id="bg-grid" class="bg" aria-hidden="true"></canvas>
<div class="app">
  <div class="topbar">
<h1>SOP Insight</h1>
<div class="divider"></div>
<div class="sim-group">
  <div class="sim-item"><label>Staff</label><input type="range" id="sim-staffing" min="1" max="50" value="10" oninput="onSimChange()"><span class="val" id="val-staffing">10</span></div>
  <div class="sim-item"><label>Auto</label><input type="range" id="sim-auto" min="0" max="100" value="70" oninput="onSimChange()"><span class="val" id="val-auto">70%</span></div>
  <div class="sim-item"><label>SLA</label><input type="range" id="sim-sla" min="1" max="72" value="24" oninput="onSimChange()"><span class="val" id="val-sla">24h</span></div>
  <div class="sim-item"><label>Vol</label><input type="range" id="sim-vol" min="100" max="20000" value="5000" oninput="onSimChange()"><span class="val" id="val-vol">5k</span></div>
  <button class="btn" id="time-btn" onclick="toggleTime()">Time</button>
  <button class="btn" onclick="simPreset('cost')">Cost</button>
  <button class="btn" onclick="simPreset('scale')">Scale</button>
</div>
<div class="time-slider" id="time-slider" style="display:none">
  <span class="time-label">t0</span><input type="range" id="time-range" min="0" max="11" value="0" oninput="onTimeSlide()"><span class="time-label">t11</span>
</div>
</div>
  <div class="main-grid">
    <div class="panel panel-left" id="panel-left"></div>
    <div class="panel panel-center" id="panel-center"></div>
    <div class="panel panel-right" id="panel-right"></div>
  </div>
  <div class="detail-overlay" id="detail-overlay">
    <div class="detail-header"><span id="detail-title" class="t-meta"></span><button class="btn btn-close" onclick="closeDetail()">&times;</button></div>
    <div class="detail-body" id="detail-body"></div>
    <div class="detail-footer" id="detail-footer"></div>
  </div>
</div>

// ===== ANIMATED CANVAS BACKGROUND (Swiss dot matrix) =====
(function(){
  var c=document.getElementById('bg-grid'),ctx=c.getContext('2d');
  var dots=[], DOT_COUNT=80, t=0;
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight}
  function init(){
    resize();
    for(var i=0;i<DOT_COUNT;i++){
      dots.push({x:Math.random()*c.width,y:Math.random()*c.height,
        r:0.6+Math.random()*1.2,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,
        phase:Math.random()*Math.PI*2,alpha:0.15+Math.random()*0.25});
    }
  }
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    // Grid lines
    ctx.strokeStyle='rgba(0,47,167,0.03)';ctx.lineWidth=0.5;
    var s=48;
    for(var x=0;x<c.width;x+=s){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.stroke()}
    for(var y=0;y<c.height;y+=s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke()}
    // Breathing dots
    t+=0.008;
    for(var i=0;i<dots.length;i++){
      var d=dots[i];
      d.x+=d.vx;d.y+=d.vy;
      if(d.x<0)d.x=c.width;if(d.x>c.width)d.x=0;
      if(d.y<0)d.y=c.height;if(d.y>c.height)d.y=0;
      var pulse=0.5+0.5*Math.sin(t*2+d.phase);
      var alpha=d.alpha*(0.6+0.4*pulse);
      ctx.fillStyle='rgba(0,47,167,'+alpha.toFixed(2)+')';
      ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  init();draw();
  window.addEventListener('resize',resize);
})();

// ===== WORKFLOW (LEFT PANEL) =====
function renderWorkflow(){
  var nodes=GP.nodes||[],h='<h2>Workflow</h2>';
  nodes.forEach(function(n){
    var cls='node-card'+(n.start?' start':'')+(n.end?' end':'');
    var badges='';
    if(n.kpi_count>0) badges+='<span class="node-badge kpi">'+n.kpi_count+' KPI</span>';
    if(n.risk_count>0) badges+='<span class="node-badge risk">'+n.risk_count+' Risk</span>';
    h+='<div class="'+cls+'" id="nc-'+n.id+'" onclick="drillNode(\''+n.id+'\')">';
    h+='<div class="name">'+n.label+badges+'</div>';
    h+='<div class="meta"><span>'+n.type+'</span><span>'+n.owner+'</span><span>'+(n.sla||0)+'h</span></div></div>';
  });
  h+='<div class="mermaid-wrap">'+GP.mermaid+'</div>';
  $('panel-left').innerHTML=h;
}

function renderRisk(){

  h+='<div class="heatmap-grid"><div class="hdr"></div><div class="hdr">Low</div><div class="hdr">Med</div><div class="hdr">High</div>';

      var cnt=cell?cell.count:0, sev=cell?cell.severity:'low', col=cell?cell.color:'#d4d4d2';
      h+='<div class="cell" style="background:'+col+'15;color:'+col+'" onclick="drillRiskCell(\''+imp+'\',\''+prob+'\')">'+(cnt||'')+'</div>';

// ===== DRILL DOWN =====
function drillNode(id){
  document.querySelectorAll('.node-card').forEach(function(c){c.classList.remove('active')});
  var el=$('nc-'+id); if(el) el.classList.add('active');
  var node=(GP.nodes||[]).find(function(n){return n.id===id}); if(!node) return;
  var h='<div class="prop-group"><h4>Node</h4>';
  h+='<div class="prop-row"><span class="k">Name</span><span class="v">'+node.label+'</span></div>';
  h+='<div class="prop-row"><span class="k">Type</span><span class="v">'+node.type+'</span></div>';
  h+='<div class="prop-row"><span class="k">SLA</span><span class="v">'+(node.sla||0)+'h</span></div></div>';
  var kpis=(KP.items||KP.metrics||[]).filter(function(k){return (k.linked_nodes||[]).indexOf(id)>=0});
  if(kpis.length){
    h+='<div class="prop-group"><h4>Bound KPIs</h4>';
    kpis.forEach(function(k){
      h+='<div class="prop-row"><span class="k">'+k.name+'</span><span class="v '+k.status+'">'+k.current+' / '+k.target+'</span></div>';
    });h+='</div>';
  }
  var risks=(RK.risk_map||[]).filter(function(r){return r.node===id});
  if(risks.length){
    h+='<div class="prop-group"><h4>Bound Risks</h4>';
    risks.forEach(function(r){
      h+='<div class="prop-row"><span class="k">'+r.name+'</span><span class="v" style="color:'+r.color+'">'+r.level+'</span></div>';
    });h+='</div>';
  }
  $('detail-title').textContent='Node: '+node.label;
  $('detail-body').innerHTML=h;
  $('detail-footer').innerHTML='<button class="btn" onclick="closeDetail()">Close</button>';
  $('detail-overlay').classList.add('open');
}
function drillRisk(name){
  var r=(RK.risk_map||[]).find(function(x){return x.name===name})||(RK.items||[]).find(function(x){return x.name===name});

  var h='<div class="prop-group"><h4>Risk</h4>';

// ===== SIMULATION =====
function runSimulation(){
  var s=simParams.staffing,a=simParams.automation/100,v=simParams.volume;
  var ai=v*a,cap=s*8*20,tp=Math.min(v,Math.floor(ai+cap));
  var bl=Math.max(0,v-tp),cost=Math.round((ai/1000*0.5+s*8*25)*100)/100;
  var h='<div class="sim-results">';
  h+='<div class="sim-stat"><div class="sim-val">'+tp.toLocaleString()+'</div><div class="sim-label">Throughput</div></div>';
  h+='<div class="sim-stat"><div class="sim-val" style="color:'+(bl>0?'var(--red)':'var(--green)')+'">'+bl.toLocaleString()+'</div><div class="sim-label">Backlog</div></div>';
  h+='<div class="sim-stat"><div class="sim-val">$'+cost.toLocaleString()+'</div><div class="sim-label">Cost/Day</div></div>';
  h+='<div class="sim-stat"><div class="sim-val">$'+(cost/Math.max(v,1)).toFixed(4)+'</div><div class="sim-label">Cost/Item</div></div>';
  h+='</div>';
  var old=$('sim-block');if(old)old.remove();
  var el=document.createElement('div');el.id='sim-block';el.innerHTML=h;
  var pc=$('panel-center');pc.insertBefore(el,pc.firstChild.nextSibling);
}

  timeMode=!timeMode;
  $('time-slider').style.display=timeMode?'flex':'none';
  $('time-btn').textContent=timeMode?'Live':'Time';
  if(timeMode) renderTimeSeries(); else renderKPI();
}
function onTimeSlide(){timeStep=parseInt($('time-range').value);renderTimeSeries();}
function renderTimeSeries(){
  var ms=KP.items||KP.metrics||[],h='<div class="gauge-large"><div class="gauge-num">'+(KP.health||0).toFixed(0)+'%</div>';
  h+='<div class="gauge-label">KPI Health at t'+timeStep+'</div></div>';
  ms.forEach(function(m){
    h+='<div class="kpi-row"><div class="name">'+m.name+'</div><div class="branch">t'+timeStep+'</div>';
    h+='<div class="val '+m.status+'">'+m.current+'</div></div>';
    var trend=m.trend||[],mx=Math.max.apply(null,trend.concat([m.target||100]));
    h+='<div class="kpi-trend" style="height:32px">';
    trend.forEach(function(v,i){
      h+='<div class="kpi-trend-bar" style="height:'+(v/mx*32)+'px;opacity:'+(0.25+i*0.06)+';'+(i===timeStep?'background:var(--orange);':'')+'" title="t'+i+': '+v+'"></div>';
    });h+='</div>';
  });
  $('panel-center').innerHTML=h;
}

// ===== KPI RECOMPUTE =====
function recomputeKPI(id,val){
  var t=parseFloat(val);if(isNaN(t))return;
  var item=(KP.items||KP.metrics||[]).find(function(x){return x.id===id});
  if(!item)return;item.target=t;
  var dir=item.direction||'higher_better';
  item.status=(dir==='lower_better'?item.current<=t:item.current>=t)?'pass':'warn';
  renderKPI();
}

init();

</script>
