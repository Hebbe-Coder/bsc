<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E86AB"/>
      <stop offset="100%" stop-color="#1B3A5C"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFB"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1280" height="5" fill="url(#topGrad)"/>
  <!-- header -->
  <rect x="60" y="28" width="42" height="42" rx="8" fill="#1B3A5C"/>
  <text x="81" y="58" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">{{CHAPTER_NUM}}</text>
  <text x="118" y="58" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24" font-weight="bold" fill="#2D3436">{{PAGE_TITLE}}</text>
  <line x1="60" y1="88" x2="1220" y2="88" stroke="#DEE2E6" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- KPI cards row - 4 cards -->
  <!-- Card 1 -->
  <g transform="translate(60,108)">
    <rect x="0" y="0" width="275" height="120" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1"/>
    <rect x="0" y="0" width="275" height="4" rx="2" fill="#2E86AB"/>
    <text x="18" y="32" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" font-weight="bold" fill="#2D3436">Throughput</text>
    <text x="18" y="55" font-family="Consolas,monospace" font-size="10" fill="#636E72">processed / day</text>
    <text x="18" y="80" font-family="Segoe UI,sans-serif" font-size="11" fill="#636E72">Target: &gt; 4000</text>
    <text x="248" y="98" text-anchor="end" font-family="Segoe UI,sans-serif" font-size="26" font-weight="bold" fill="#2CA02C">&uarr;</text>
  </g>
  <!-- Card 2 -->
  <g transform="translate(355,108)">
    <rect x="0" y="0" width="275" height="120" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1"/>
    <rect x="0" y="0" width="275" height="4" rx="2" fill="#2CA02C"/>
    <text x="18" y="32" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" font-weight="bold" fill="#2D3436">Accuracy Rate</text>
    <text x="18" y="55" font-family="Consolas,monospace" font-size="10" fill="#636E72">correct / total</text>
    <text x="18" y="80" font-family="Segoe UI,sans-serif" font-size="11" fill="#636E72">Target: &gt; 99%</text>
    <text x="248" y="98" text-anchor="end" font-family="Segoe UI,sans-serif" font-size="26" font-weight="bold" fill="#2CA02C">&uarr;</text>
  </g>
  <!-- Card 3 -->
  <g transform="translate(650,108)">
    <rect x="0" y="0" width="275" height="120" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1"/>
    <rect x="0" y="0" width="275" height="4" rx="2" fill="#F4A261"/>
    <text x="18" y="32" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" font-weight="bold" fill="#2D3436">Queue Length</text>
    <text x="18" y="55" font-family="Consolas,monospace" font-size="10" fill="#636E72">pending_count</text>
    <text x="18" y="80" font-family="Segoe UI,sans-serif" font-size="11" fill="#636E72">Target: &lt; 200</text>
    <text x="248" y="98" text-anchor="end" font-family="Segoe UI,sans-serif" font-size="26" font-weight="bold" fill="#E83151">&darr;</text>
  </g>
  <!-- Card 4 -->
  <g transform="translate(945,108)">
    <rect x="0" y="0" width="275" height="120" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1"/>
    <rect x="0" y="0" width="275" height="4" rx="2" fill="#E83151"/>
    <text x="18" y="32" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14" font-weight="bold" fill="#2D3436">SLA Compliance</text>
    <text x="18" y="55" font-family="Consolas,monospace" font-size="10" fill="#636E72">sla_met / total</text>
    <text x="18" y="80" font-family="Segoe UI,sans-serif" font-size="11" fill="#636E72">Target: &gt; 99.5%</text>
    <text x="248" y="98" text-anchor="end" font-family="Segoe UI,sans-serif" font-size="26" font-weight="bold" fill="#2CA02C">&uarr;</text>
  </g>
  <!-- Metrics table -->
  <g transform="translate(60,248)">
    <text x="0" y="15" font-family="Segoe UI,sans-serif" font-size="11" font-weight="bold" fill="#2E86AB" text-transform="uppercase">FULL METRICS CATALOG</text>
    <!-- table header -->
    <rect x="0" y="30" width="1160" height="28" rx="4" fill="#1B3A5C"/>
    <text x="10" y="50" font-family="Segoe UI,sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">ID</text>
    <text x="60" y="50" font-family="Segoe UI,sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Metric</text>
    <text x="220" y="50" font-family="Segoe UI,sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Formula</text>
    <text x="520" y="50" font-family="Segoe UI,sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Target</text>
    <text x="720" y="50" font-family="Segoe UI,sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Warning</text>
    <text x="880" y="50" font-family="Segoe UI,sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Branch</text>
    <!-- rows -->
    {{TABLE_ROWS}}
  </g>
  <!-- footer -->
  <rect x="0" y="716" width="1280" height="4" fill="#1B3A5C"/>
  <text x="640" y="695" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" fill="#636E72">{{PAGE_NUM}}</text>
  <text x="1220" y="695" text-anchor="end" font-family="Segoe UI,sans-serif" font-size="11" fill="#636E72" opacity="0.6">BSC ? Business System Compiler</text>
</svg>