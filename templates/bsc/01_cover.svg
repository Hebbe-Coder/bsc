<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5C"/>
      <stop offset="60%" stop-color="#142B45"/>
      <stop offset="100%" stop-color="#0D1B2E"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <!-- decorations -->
  <circle cx="1100" cy="150" r="250" fill="#FFFFFF" opacity="0.02"/>
  <circle cx="1200" cy="80" r="150" fill="#2E86AB" opacity="0.06"/>
  <circle cx="100" cy="650" r="200" fill="#2E86AB" opacity="0.04"/>
  <line x1="900" y1="0" x2="1280" y2="380" stroke="#2E86AB" stroke-width="1" opacity="0.10"/>
  <!-- top accent line -->
  <rect x="0" y="0" width="1280" height="5" fill="#2E86AB"/>
  <!-- main title area -->
  <rect x="0" y="240" width="850" height="170" fill="#000000" opacity="0.20"/>
  <rect x="0" y="240" width="6" height="170" fill="#2E86AB"/>
  <text x="70" y="315" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF">{{TITLE}}</text>
  <text x="70" y="375" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#B2BEC3">{{SUBTITLE}}</text>
  <line x1="70" y1="450" x2="350" y2="450" stroke="#2E86AB" stroke-width="2" opacity="0.8"/>
  <!-- meta -->
  <text x="70" y="520" font-family="Segoe UI,sans-serif" font-size="18" fill="#FFFFFF" opacity="0.9">Generated by BSC Engine</text>
  <text x="70" y="555" font-family="Segoe UI,sans-serif" font-size="14" fill="#B2BEC3">{{DATE}}</text>
  <!-- domain badge -->
  <rect x="70" y="585" rx="6" width="180" height="30" fill="#2E86AB" opacity="0.8"/>
  <text x="160" y="606" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">{{DOMAIN}}</text>
  <!-- footer -->
  <rect x="0" y="700" width="1280" height="20" fill="#0D1B2E"/>
  <text x="1210" y="714" text-anchor="end" font-family="Segoe UI,sans-serif" font-size="12" fill="#636E72">BSC ? Business System Compiler ? CONFIDENTIAL</text>
</svg>