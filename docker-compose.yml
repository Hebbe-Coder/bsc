services:
  bsc-backend:
    build:
      context: .
      dockerfile: Dockerfile
    # Local operator settings must not be interpolated from the host process.
    # This optional, ignored file only enables the plugin-config fallback; the
    # Obsidian plugin token stays inside the mounted Vault.
    env_file:
      - path: ./.env.runtime
        required: false
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LLM_PROVIDER=${LLM_PROVIDER:?LLM_PROVIDER must be configured for production}
      - ANALYSIS_PROVIDER=${ANALYSIS_PROVIDER:-deepseek}
      - GENERATION_PROVIDER=${GENERATION_PROVIDER:-deepseek}
      - SOP_LLM_PROVIDER=${SOP_LLM_PROVIDER:-deepseek}
      - RAG_LLM_PROVIDER=${RAG_LLM_PROVIDER:-deepseek}
      - ALLOW_MOCK_LLM_IN_PRODUCTION=${ALLOW_MOCK_LLM_IN_PRODUCTION:-false}
      - CACHE_TYPE=redis
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - EVENT_BACKEND=redis
      - DB_TYPE=postgresql
      - DB_PATH=/data/bsc_cloud.db
      - DB_URL=postgresql://${POSTGRES_USER:-bsc}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-bsc}
      - DBOS_DATA_ROOT=/data/dbos
      - CELERY_ENABLED=${CELERY_ENABLED:-true}
      - CELERY_KNOWLEDGE_QUEUE=bsc_docker_knowledge
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/2
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/3
      - KNOWLEDGE_WIKI_ENABLED=${KNOWLEDGE_WIKI_ENABLED:-false}
      - KNOWLEDGE_OBSIDIAN_SYNC_ENABLED=${KNOWLEDGE_OBSIDIAN_SYNC_ENABLED:-false}
      - KNOWLEDGE_SCHEDULES_ENABLED=${KNOWLEDGE_SCHEDULES_ENABLED:-false}
      - KNOWLEDGE_GROWTH_ENABLED=${KNOWLEDGE_GROWTH_ENABLED:-false}
      - KNOWLEDGE_GROWTH_SEMANTIC_DISTILLATION_ENABLED=${KNOWLEDGE_GROWTH_SEMANTIC_DISTILLATION_ENABLED:-true}
      - KNOWLEDGE_INTELLIGENCE_ENABLED=${KNOWLEDGE_INTELLIGENCE_ENABLED:-false}
      - KNOWLEDGE_INTELLIGENCE_INGRESS_SIGNING_SECRET=${KNOWLEDGE_INTELLIGENCE_INGRESS_SIGNING_SECRET:-}
      - KNOWLEDGE_INTELLIGENCE_N8N_MANUAL_TRIGGER_ENABLED=${KNOWLEDGE_INTELLIGENCE_N8N_MANUAL_TRIGGER_ENABLED:-false}
      - KNOWLEDGE_INTELLIGENCE_N8N_MANUAL_TRIGGER_URL=${KNOWLEDGE_INTELLIGENCE_N8N_MANUAL_TRIGGER_URL:-http://n8n:5678/webhook/bsc-governed-rss-intelligence/manual}
      - KNOWLEDGE_INTELLIGENCE_N8N_MANUAL_TRIGGER_PROJECT_ID=${N8N_BSC_PROJECT_ID:-}
      - KNOWLEDGE_INTELLIGENCE_N8N_MANUAL_TRIGGER_TIMEOUT_SECONDS=${KNOWLEDGE_INTELLIGENCE_N8N_MANUAL_TRIGGER_TIMEOUT_SECONDS:-330}
      - KNOWLEDGE_TESSERACT_PATH=${KNOWLEDGE_TESSERACT_PATH:-}
      - KNOWLEDGE_FFPROBE_PATH=${KNOWLEDGE_FFPROBE_PATH:-}
      - KNOWLEDGE_MCP_WRITE_ENABLED=${KNOWLEDGE_MCP_WRITE_ENABLED:-false}
      - KNOWLEDGE_WIKI_AUTO_PUBLISH_ENABLED=${KNOWLEDGE_WIKI_AUTO_PUBLISH_ENABLED:-false}
      - KNOWLEDGE_WIKI_LLM_PROVIDER=${KNOWLEDGE_WIKI_LLM_PROVIDER:-}
      - KNOWLEDGE_WIKI_LLM_TIMEOUT_SECONDS=${KNOWLEDGE_WIKI_LLM_TIMEOUT_SECONDS:-90}
      - KNOWLEDGE_WIKI_LLM_MAX_ATTEMPTS=${KNOWLEDGE_WIKI_LLM_MAX_ATTEMPTS:-1}
      - PBOS_LLM_TIMEOUT_SECONDS=${PBOS_LLM_TIMEOUT_SECONDS:-120}
      - PBOS_LLM_MODEL=${PBOS_LLM_MODEL:-}
      - PBOS_LLM_MAX_OUTPUT_TOKENS=${PBOS_LLM_MAX_OUTPUT_TOKENS:-2600}
      - PBOS_LLM_MAX_STRUCTURED_ATTEMPTS=${PBOS_LLM_MAX_STRUCTURED_ATTEMPTS:-2}
      - PBOS_LLM_MAX_CONTEXT_DOCUMENTS=${PBOS_LLM_MAX_CONTEXT_DOCUMENTS:-4}
      - PBOS_LLM_CONTEXT_DOCUMENT_MAX_TOKENS=${PBOS_LLM_CONTEXT_DOCUMENT_MAX_TOKENS:-180}
      - PBOS_WORKSPACE_ROOT=/workspace
      - KNOWLEDGE_GROWTH_LLM_TIMEOUT_SECONDS=${KNOWLEDGE_GROWTH_LLM_TIMEOUT_SECONDS:-150}
      - KNOWLEDGE_GROWTH_TASK_SOFT_TIMEOUT_SECONDS=${KNOWLEDGE_GROWTH_TASK_SOFT_TIMEOUT_SECONDS:-390}
      - KNOWLEDGE_GROWTH_TASK_TIMEOUT_SECONDS=${KNOWLEDGE_GROWTH_TASK_TIMEOUT_SECONDS:-420}
      - KNOWLEDGE_SOURCE_SYNC_RECOVERY_TIMEOUT_SECONDS=${KNOWLEDGE_SOURCE_SYNC_RECOVERY_TIMEOUT_SECONDS:-900}
      - HORIZON_ENABLED=${HORIZON_ENABLED:-false}
      - HORIZON_API_BASE_URL=${HORIZON_API_BASE_URL:-}
      - HORIZON_API_KEY=${HORIZON_API_KEY:-}
      - HORIZON_RUNS_ROOT=${HORIZON_RUNS_ROOT:-/horizon-runs}
      - HORIZON_STAGE_URL_TEMPLATE=${HORIZON_STAGE_URL_TEMPLATE:-/api/runs/{run_id}/stages/{stage}}
      - HORIZON_TIMEOUT_SECONDS=${HORIZON_TIMEOUT_SECONDS:-20}
      - HORIZON_MAX_RESPONSE_BYTES=${HORIZON_MAX_RESPONSE_BYTES:-2000000}
      - HORIZON_MAX_ARTIFACT_AGE_HOURS=${HORIZON_MAX_ARTIFACT_AGE_HOURS:-48}
      - HORIZON_ALLOW_PRIVATE_NETWORK=${HORIZON_ALLOW_PRIVATE_NETWORK:-false}
      - OBSIDIAN_VAULT_ROOT=/vault

      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      
      - DOUBAO_API_KEY=${DOUBAO_API_KEY:-}
      - DOUBAO_BASE_URL=${DOUBAO_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      - DOUBAO_MODEL=${DOUBAO_MODEL:-doubao-pro-32k}
      
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - QWEN_BASE_URL=${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - QWEN_MODEL=${QWEN_MODEL:-qwen-plus}
      
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      
      - API_KEY=${API_KEY:?API_KEY must be set for production}
      
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_BACKEND=redis
      - SIGNATURE_ENABLED=${SIGNATURE_ENABLED:-false}
      
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["http://localhost:8000"]}
    volumes:
      - bsc-data:/data
      - bsc-output:/app/output
      - ${OBSIDIAN_VAULT_HOST_PATH:?OBSIDIAN_VAULT_HOST_PATH must be set}:/vault
      - ${HORIZON_RUNS_HOST_PATH:-./data/horizon-runs}:/horizon-runs:ro
      - ${PBOS_WORKSPACE_HOST_PATH:-.}:/workspace:ro
    networks:
      - bsc-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_PORT=11434
    networks:
      - bsc-network
    restart: unless-stopped
    profiles:
      - ollama
      - full

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - bsc-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-bsc}
      - POSTGRES_USER=${POSTGRES_USER:-bsc}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      # Keep the pre-cutover volume untouched for rollback. The active runtime
      # starts from a fresh, Compose-owned PostgreSQL cluster and is populated
      # only through scripts/migrate_sqlite_to_postgres.py.
      - postgres-data-v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bsc} -d ${POSTGRES_DB:-bsc}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - bsc-network
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4 --queues=bsc_docker_knowledge
    environment:
      - CELERY_ENABLED=true
      - CELERY_KNOWLEDGE_QUEUE=bsc_docker_knowledge
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/2
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/3
      - CACHE_TYPE=redis
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - EVENT_BACKEND=redis
      - DB_TYPE=postgresql
      - DB_PATH=/data/bsc_cloud.db
      - DB_URL=postgresql://${POSTGRES_USER:-bsc}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-bsc}
      - DBOS_DATA_ROOT=/data/dbos
      - RATE_LIMIT_BACKEND=redis
      - OBSIDIAN_VAULT_ROOT=/vault
      - KNOWLEDGE_WIKI_ENABLED=true
      - KNOWLEDGE_OBSIDIAN_SYNC_ENABLED=${KNOWLEDGE_OBSIDIAN_SYNC_ENABLED:-false}
      - KNOWLEDGE_SCHEDULES_ENABLED=${KNOWLEDGE_SCHEDULES_ENABLED:-false}
      - KNOWLEDGE_GROWTH_ENABLED=${KNOWLEDGE_GROWTH_ENABLED:-false}
      - KNOWLEDGE_GROWTH_SEMANTIC_DISTILLATION_ENABLED=${KNOWLEDGE_GROWTH_SEMANTIC_DISTILLATION_ENABLED:-true}
      - KNOWLEDGE_TESSERACT_PATH=${KNOWLEDGE_TESSERACT_PATH:-}
      - KNOWLEDGE_FFPROBE_PATH=${KNOWLEDGE_FFPROBE_PATH:-}
      - KNOWLEDGE_MCP_WRITE_ENABLED=${KNOWLEDGE_MCP_WRITE_ENABLED:-false}
      - KNOWLEDGE_WIKI_AUTO_PUBLISH_ENABLED=${KNOWLEDGE_WIKI_AUTO_PUBLISH_ENABLED:-false}
      - KNOWLEDGE_WIKI_LLM_PROVIDER=${KNOWLEDGE_WIKI_LLM_PROVIDER:-}
      - KNOWLEDGE_WIKI_LLM_TIMEOUT_SECONDS=${KNOWLEDGE_WIKI_LLM_TIMEOUT_SECONDS:-90}
      - KNOWLEDGE_WIKI_LLM_MAX_ATTEMPTS=${KNOWLEDGE_WIKI_LLM_MAX_ATTEMPTS:-1}
      - PBOS_LLM_TIMEOUT_SECONDS=${PBOS_LLM_TIMEOUT_SECONDS:-120}
      - PBOS_LLM_MODEL=${PBOS_LLM_MODEL:-}
      - PBOS_LLM_MAX_OUTPUT_TOKENS=${PBOS_LLM_MAX_OUTPUT_TOKENS:-2600}
      - PBOS_LLM_MAX_STRUCTURED_ATTEMPTS=${PBOS_LLM_MAX_STRUCTURED_ATTEMPTS:-2}
      - PBOS_LLM_MAX_CONTEXT_DOCUMENTS=${PBOS_LLM_MAX_CONTEXT_DOCUMENTS:-4}
      - PBOS_LLM_CONTEXT_DOCUMENT_MAX_TOKENS=${PBOS_LLM_CONTEXT_DOCUMENT_MAX_TOKENS:-180}
      - KNOWLEDGE_GROWTH_LLM_TIMEOUT_SECONDS=${KNOWLEDGE_GROWTH_LLM_TIMEOUT_SECONDS:-150}
      - KNOWLEDGE_GROWTH_TASK_SOFT_TIMEOUT_SECONDS=${KNOWLEDGE_GROWTH_TASK_SOFT_TIMEOUT_SECONDS:-390}
      - KNOWLEDGE_GROWTH_TASK_TIMEOUT_SECONDS=${KNOWLEDGE_GROWTH_TASK_TIMEOUT_SECONDS:-420}
      - KNOWLEDGE_SOURCE_SYNC_RECOVERY_TIMEOUT_SECONDS=${KNOWLEDGE_SOURCE_SYNC_RECOVERY_TIMEOUT_SECONDS:-900}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - ANALYSIS_PROVIDER=${ANALYSIS_PROVIDER:-deepseek}
      - GENERATION_PROVIDER=${GENERATION_PROVIDER:-deepseek}
      - SOP_LLM_PROVIDER=${SOP_LLM_PROVIDER:-deepseek}
      - RAG_LLM_PROVIDER=${RAG_LLM_PROVIDER:-deepseek}
      - HORIZON_ENABLED=${HORIZON_ENABLED:-false}
      - HORIZON_API_BASE_URL=${HORIZON_API_BASE_URL:-}
      - HORIZON_API_KEY=${HORIZON_API_KEY:-}
      - HORIZON_RUNS_ROOT=${HORIZON_RUNS_ROOT:-/horizon-runs}
      - HORIZON_STAGE_URL_TEMPLATE=${HORIZON_STAGE_URL_TEMPLATE:-/api/runs/{run_id}/stages/{stage}}
      - HORIZON_TIMEOUT_SECONDS=${HORIZON_TIMEOUT_SECONDS:-20}
      - HORIZON_MAX_RESPONSE_BYTES=${HORIZON_MAX_RESPONSE_BYTES:-2000000}
      - HORIZON_MAX_ARTIFACT_AGE_HOURS=${HORIZON_MAX_ARTIFACT_AGE_HOURS:-48}
      - HORIZON_ALLOW_PRIVATE_NETWORK=${HORIZON_ALLOW_PRIVATE_NETWORK:-false}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - bsc-data:/data
      - bsc-output:/app/output
      - ${OBSIDIAN_VAULT_HOST_PATH:?OBSIDIAN_VAULT_HOST_PATH must be set}:/vault
      - ${HORIZON_RUNS_HOST_PATH:-./data/horizon-runs}:/horizon-runs:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - bsc-network
    restart: unless-stopped
    healthcheck:
      disable: true
    profiles:
      - celery
      - full

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      - CELERY_ENABLED=true
      - CELERY_KNOWLEDGE_QUEUE=bsc_docker_knowledge
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/2
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/3
      - CACHE_TYPE=redis
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - EVENT_BACKEND=redis
      - DB_TYPE=postgresql
      - DB_PATH=/data/bsc_cloud.db
      - DB_URL=postgresql://${POSTGRES_USER:-bsc}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-bsc}
      - RATE_LIMIT_BACKEND=redis
      - OBSIDIAN_VAULT_ROOT=/vault
      - KNOWLEDGE_WIKI_ENABLED=true
      - KNOWLEDGE_OBSIDIAN_SYNC_ENABLED=${KNOWLEDGE_OBSIDIAN_SYNC_ENABLED:-false}
      - KNOWLEDGE_SCHEDULES_ENABLED=${KNOWLEDGE_SCHEDULES_ENABLED:-false}
      - KNOWLEDGE_GROWTH_ENABLED=${KNOWLEDGE_GROWTH_ENABLED:-false}
      - KNOWLEDGE_GROWTH_SEMANTIC_DISTILLATION_ENABLED=${KNOWLEDGE_GROWTH_SEMANTIC_DISTILLATION_ENABLED:-true}
      - KNOWLEDGE_MCP_WRITE_ENABLED=${KNOWLEDGE_MCP_WRITE_ENABLED:-false}
      - KNOWLEDGE_WIKI_AUTO_PUBLISH_ENABLED=${KNOWLEDGE_WIKI_AUTO_PUBLISH_ENABLED:-false}
    volumes:
      - bsc-data:/data
      - bsc-output:/app/output
      - ${OBSIDIAN_VAULT_HOST_PATH:?OBSIDIAN_VAULT_HOST_PATH must be set}:/vault
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - bsc-network
    restart: unless-stopped
    healthcheck:
      disable: true
    profiles:
      - celery
      - full

  # Discovery is opt-in: it is neither started by `docker compose up` nor
  # reachable off the local machine. It has its own encrypted credential
  # store and only submits signed, project-scoped batches to BSC.
  n8n:
    image: ghcr.io/n8n-io/n8n:1.106.3
    entrypoint: ["/bin/sh", "-c"]
    command:
      - test -n "$$N8N_ENCRYPTION_KEY" || { echo "N8N_ENCRYPTION_KEY must be set"; exit 64; }; exec n8n start
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # Opt in before n8n makes task runners the default in a future release.
      - N8N_RUNNERS_ENABLED=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-}
      # BSC is the durable evidence and audit store. n8n must not retain raw
      # provider bodies in its execution database after a run completes.
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_ON_ERROR=none
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=false
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=false
      - GENERIC_TIMEZONE=Asia/Shanghai
      - TZ=Asia/Shanghai
      - BSC_SIGNAL_INGRESS_URL=http://bsc-backend:8000/knowledge/intelligence/signal-batches
      - BSC_INFORMATION_SOURCE_MANIFEST_URL=${N8N_BSC_SOURCE_MANIFEST_URL:-http://bsc-backend:8000/knowledge/intelligence/n8n/source-manifest}
      - BSC_PROJECT_INGRESS_KEY=${N8N_BSC_PROJECT_INGRESS_KEY:-}
      - BSC_SIGNAL_SIGNING_SECRET=${KNOWLEDGE_INTELLIGENCE_INGRESS_SIGNING_SECRET:-}
      - N8N_BSC_PROJECT_ID=${N8N_BSC_PROJECT_ID:-}
      - N8N_BSC_RSS_REGISTRY_ID=${N8N_BSC_RSS_REGISTRY_ID:-}
      - N8N_RSS_FEED_URL=${N8N_RSS_FEED_URL:-}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/opt/bsc-workflows:ro
    networks:
      - bsc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    profiles:
      - n8n

volumes:
  bsc-data:
    driver: local
  bsc-output:
    driver: local
  ollama-data:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local
  postgres-data-v2:
    driver: local
  n8n-data:
    driver: local

networks:
  bsc-network:
    driver: bridge
