apiVersion: v1
kind: PersistentVolume
metadata:
  name: bsc-output-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  nfs:
    server: nfs-server.example.com
    path: /exports/bsc/output

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bsc-data-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  nfs:
    server: nfs-server.example.com
    path: /exports/bsc/data
